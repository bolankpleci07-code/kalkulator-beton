<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Beton V6.0</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .kalkulator-box {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            margin-top: 0;
            color: #1a1a1a;
            font-size: 22px;
            border-bottom: 2px solid #e4e6eb;
            padding-bottom: 10px;
        }
        h3 {
            color: #444;
            font-size: 16px;
            margin: 20px 0 15px 0;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #4b5563;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 15px;
            color: #1f2937;
            background-color: #f9fafb;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #2563eb;
            background-color: #fff;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .wrapper-hasil {
            margin-top: 25px;
            padding: 15px;
            background-color: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            text-align: center;
        }
        .label-hasil {
            font-size: 14px;
            color: #1e40af;
            font-weight: 500;
        }
        .nilai-hasil {
            font-size: 26px;
            font-weight: 800;
            color: #1d4ed8;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="kalkulator-box">
    <h2>Kalkulator Beton V6.0</h2>
    
    <div class="input-group">
        <label for="jenisBeton">Jenis Beton</label>
        <select id="jenisBeton">
            <option value="K-225">K-225</option>
            <option value="K-175">K-175</option>
            <option value="K-250">K-250</option>
            <option value="K-300">K-300</option>
        </select>
    </div>

    <h3>Perhitungan Volume Beton</h3>

    <div class="input-group">
        <label for="bentukBeton">Bentuk Beton</label>
        <!-- onchange berfungsi mendeteksi jika pengguna mengganti bentuk beton -->
        <select id="bentukBeton" onchange="sesuaikanFormulir()">
            <option value="balok">Balok / Plat</option>
            <option value="silinder">Silinder (Kolom Bulat)</option>
        </select>
    </div>

    <div class="input-group">
        <label for="panjang">Panjang (meter)</label>
        <input type="number" id="panjang" step="any" placeholder="Masukkan panjang">
    </div>

    <!-- Kolom Lebar/Diameter wajib memiliki ID yang jelas -->
    <div class="input-group">
        <label id="labelLebar" for="lebar">Lebar (meter)</label>
        <input type="number" id="lebar" step="any" placeholder="Masukkan lebar">
    </div>

    <div class="input-group">
        <label for="tinggi">Tinggi / Tebal (meter)</label>
        <input type="number" id="tinggi" step="any" placeholder="Contoh: 0.15">
    </div>

    <!-- Tombol memicu fungsi hitungvolume() di JavaScript -->
    <button type="button" onclick="hitungvolume()">HITUNG VOLUME</button>

    <div class="wrapper-hasil">
        <div class="label-hasil">Volume Beton</div>
        <div class="nilai-hasil" id="hasilVolume">0.000 m³</div>
    </div>
</div>

<!-- KODE JAVASCRIPT DIGABUNG DI SINI -->
<script>
    // Fungsi mengubah teks input secara otomatis berdasarkan bentuk beton yang dipilih
    function sesuaikanFormulir() {
        const bentuk = document.getElementById("bentukBeton").value;
        const labelLebar = document.getElementById("labelLebar");
        const inputLebar = document.getElementById("lebar");

        if (bentuk === "silinder") {
            labelLebar.innerText = "Diameter (meter)";
            inputLebar.placeholder = "Masukkan diameter silinder";
        } else {
            labelLebar.innerText = "Lebar (meter)";
            inputLebar.placeholder = "Masukkan lebar";
        }
    }

    // Fungsi Utama Hitung Volume
    function hitungvolume() {
        // PENTING: Menggunakan parseFloat() agar input teks dikonversi menjadi angka desimal matematika murni.
        // Penambahan "|| 0" memastikan jika kotak input kosong, nilainya dibaca 0 (bukan kosongan/NaN).
        const panjang = parseFloat(document.getElementById("panjang").value) || 0;
        const lebar = parseFloat(document.getElementById("lebar").value) || 0;
        const tinggi = parseFloat(document.getElementById("tinggi").value) || 0;
        const bentuk = document.getElementById("bentukBeton").value;

        let volume = 0;

        if (bentuk === "balok" || bentuk === "plat") {
            // Rumus Balok: Panjang x Lebar x Tinggi
            volume = panjang * lebar * tinggi;
        } else if (bentuk === "silinder") {
            // Rumus Silinder: Nilai 'lebar' bertindak sebagai diameter, maka dibagi 2 untuk mendapat radius
            const radius = lebar / 2;
            volume = Math.PI * radius * radius * tinggi;
        } else {
            alert("Bentuk beton tidak valid!");
            return;
        }

        // Menampilkan hasil akhir ke layar HTML dengan batasan 3 angka di belakang koma desimal (.toFixed(3))
        document.getElementById("hasilVolume").textContent = volume.toFixed(3) + " m³";
    }
</script>

</body>
</html>
